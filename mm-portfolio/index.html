 q.oninput=()=>tiles.forEach(([,b])=>b.style.display=b.dataset.k.includes(q.value.toLowerCase())?'':'none');
 w.append(top,card,q,g);app.append(w);
 const cnt=async(p,k)=>{const{count}=await p;if(count){const b=tiles.find(t=>t[0]===k)[1];b.append(el('span','dot',String(count)))}};
 cnt(sb.from('payments').select('id',{count:'exact',head:true}).is('seen_at',null),'payments');
 cnt(sb.from('custom_requests').select('id',{count:'exact',head:true}).eq('status','new'),'requests');
 cnt(sb.from('error_events').select('id',{count:'exact',head:true}).gte('created_at',new Date(Date.now()-864e5).toISOString()),'errors')}
/* ===== generic section ===== */
function fld(f,v){const w=el('label','f'+(f.type==='bool'?' inl':''));let i,get;const sp=el('span',null,f.l);
 if(f.type==='textarea'||f.type==='lines'){i=el('textarea');i.rows=f.type==='lines'?5:4;i.value=f.type==='lines'?(v||[]).join('\n'):(v??'');get=()=>f.type==='lines'?i.value.split('\n').map(s=>s.trim()).filter(Boolean):(i.value.trim()||null)}
 else if(f.type==='select'){i=el('select');f.opts.forEach(o=>{const op=el('option',null,o);op.value=o;i.append(op)});i.value=v??f.opts[0];get=()=>i.value}
 else if(f.type==='bool'){i=el('input');i.type='checkbox';i.checked=!!v;get=()=>i.checked}
 else if(f.type==='money'){i=el('input');i.type='number';i.min='0';i.step='0.01';i.value=v==null?'':Number(v)/100;get=()=>i.value===''?null:Math.round(Number(i.value)*100)}
 else if(f.type==='image'){i=el('div','img');const pv=el('img'),fi=el('input');fi.type='file';fi.accept='image/png,image/jpeg,image/webp';let cur=v||null;
  const show=()=>{if(cur){pv.src=sb.storage.from(f.bucket).getPublicUrl(cur).data.publicUrl;pv.style.display='block'}else pv.style.display='none'};show();
  fi.onchange=async()=>{const fl=fi.files[0];if(!fl)return;try{cur=await uploadImage(fl,f.bucket);show();toast('Image uploaded')}catch(e){toast(e.message||'Upload failed');fi.value=''}};i.append(pv,fi);get=()=>cur}
 else{i=el('input');i.type=f.type==='number'?'number':'text';if(f.type==='number'){i.step=f.step||'1';if(f.min!=null)i.min=f.min;if(f.max!=null)i.max=f.max}i.value=v??'';get=()=>{const s=i.value.trim();return s===''?null:(f.type==='number'?Number(s):s)}}
 if(f.max&&f.type!=='number'&&'maxLength' in i)i.maxLength=f.max;if(f.ro&&'disabled' in i)i.disabled=true;
 if(f.type==='bool')w.append(i,sp);else w.append(sp,i);return{node:w,get,f,input:i}}
function check(items){for(const x of items){const v=x.get(),f=x.f;if(f.ro)continue;if(f.req&&(v==null||v===''))return f.l+' is required';if(v!=null&&typeof v==='string'){if(f.max&&v.length>f.max)return f.l+' is too long';if(f.pattern&&!f.pattern.test(v))return f.l+' is not valid'}}return null}
async function section(key){const c=S[key];if(!c)return dash();app.textContent='';const w=el('div','wrap'),top=el('div','top');top.append(el('h1',null,c.t),btn('← Back',()=>{location.hash='#/'}));w.append(top);app.append(w);
 const head=el('div','act'),list=el('div','list');w.append(head,list);
 const{data,error}=await sb.from(c.table).select('*').order(c.order[0],{ascending:c.order[1]});if(error)return toast(error.message);const rows=(data||[]).filter(r=>!(c.table==='site_content'&&String(r.key).startsWith('legal.')));
 if(!c.noAdd)head.append(btn('+ Add new',()=>edit(key,null),'btn pt'));if(c.head)c.head(head,rows);
 if(c.markSeen)sb.from('payments').update({seen_at:new Date().toISOString()}).is('seen_at',null).then(()=>{});
 if(!rows.length)list.append(el('p',null,'Nothing here yet.'));
 rows.forEach(r=>{const b=el('button','row'),d=el('div'),[a,s]=c.row(r);d.append(el('div',null,a),el('small',null,s));b.append(d,el('span',null,'❯'));b.onclick=()=>edit(key,r);list.append(b)})}
async function edit(key,row){const c=S[key],pk=c.pk||'id';app.textContent='';const w=el('div','wrap'),top=el('div','top');top.append(el('h1',null,row?'Edit':'Add'),btn('← Back',()=>section(key)));w.append(top);app.append(w);
 const f=el('form'),items=c.fields.map(x=>{const it=fld(x,row?row[x.k]:(x.type==='bool'?true:null));if(x.lockOnEdit&&row)it.input.disabled=true;f.append(it.node);return it});w.append(f);
 const kids=(c.kids||[]).map(kd=>{const box=el('div','kids'),rowsEl=el('div'),add=btn('+ Add',()=>addRow(),'btn');let rs=[];box.append(el('h3',null,kd.t),rowsEl,add);f.append(box);
  const addRow=(v)=>{if(rs.length>=kd.max)return toast('Limit reached');const k=el('div','kid'),its=kd.fields.map(x=>{const it=fld(x,v?v[x.k]:(x.k==='anchor_x'||x.k==='anchor_y'?.5:null));k.append(it.node);return it}),o={its,k};rs.push(o);
   k.append(btn('Remove',()=>{rs=rs.filter(z=>z!==o);k.remove()}));rowsEl.append(k)};
  if(row)sb.from(kd.table).select('*').eq('item_id',row.id).order('sort_order').then(({data})=>(data||[]).forEach(addRow));
  return{kd,get:()=>rs.map(o=>o.its)}});
 if(c.audio&&row&&row.audio_path){const b=el('div','kids');b.append(el('h3',null,'Voice note'));sb.storage.from('request-audio').createSignedUrl(row.audio_path,300).then(({data})=>{if(!data)return;const a=el('audio');a.controls=true;a.src=data.signedUrl;const dl=el('a',null,'Download');dl.href=data.signedUrl;dl.download='voice-note';dl.style.color='var(--ink2)';b.append(a,dl)});
  b.append(btn('Delete audio only',async()=>{if(!confirm('Delete this voice note?'))return;await sb.storage.from('request-audio').remove([row.audio_path]);await sb.from('custom_requests').update({audio_path:null,audio_bytes:null}).eq('id',row.id);toast('Audio deleted');edit(key,{...row,audio_path:null})}));f.append(b)}
 const act=el('div','act');if(!c.ro)act.append(Object.assign(el('button','btn pt','Save'),{type:'submit'}));
 if(row&&!c.noDel&&!c.ro&&!c.clear)act.append(btn('Delete',async()=>{if(!confirm('Delete permanently?'))return;if(c.audio&&row.audio_path)await sb.storage.from('request-audio').remove([row.audio_path]);const{error}=await sb.from(c.table).delete().eq(pk,row[pk]);if(error)return toast(error.message);toast('Deleted');section(key)}));
 if(c.clear&&row)act.append(btn('Clear this error',async()=>{const{error}=await sb.from('error_events').delete().eq('fingerprint',row.fingerprint);if(error)return toast(error.message);toast('Cleared');section(key)}));
 f.append(act);
 f.onsubmit=async ev=>{ev.preventDefault();if(c.ro)return;const err=check(items);if(err)return toast(err);for(const k of kids){for(const its of k.get()){const e2=check(its);if(e2)return toast(e2)}}
  const p={};items.forEach(x=>{if(x.f.ro||x.f.type==='money'&&c.table==='quotes')return;p[x.f.k]=x.get()});
  if(key==='portfolio'&&p.status==='published'&&!(row&&row.published_at))p.published_at=new Date().toISOString();
  if(key==='portfolio'&&!p.cta_label)p.cta_label='Get your own version';
  let res=row?await sb.from(c.table).update(p).eq(pk,row[pk]).select().single():await sb.from(c.table).insert(p).select().single();
  if(res.error)return toast(res.error.message);const id=res.data.id;
  for(const k of kids){const del=await sb.from(k.kd.table).delete().eq('item_id',id);if(del.error)return toast(del.error.message);const arr=k.get().map((its,i)=>{const o={item_id:id,sort_order:i};its.forEach(x=>o[x.f.k]=x.get());return o});if(arr.length){const ins=await sb.from(k.kd.table).insert(arr);if(ins.error)return toast(ins.error.message)}}
  toast('Saved. Press Publish on the home screen when you finish editing.');section(key)}}
/* ===== analytics (anonymous visitor counts; data comes from the track function) ===== */
async function analytics(){app.textContent='';const w=el('div','wrap'),top=el('div','top');top.append(el('h1',null,'Analytics'),btn('← Back',()=>{location.hash='#/'}));w.append(top);app.append(w);
 const sel=el('select');[7,30,90,365].forEach(d=>{const o=el('option',null,'Last '+d+' days');o.value=d;if(d===30)o.selected=true;sel.append(o)});const box=el('div','an');w.append(sel,box);
 const bars=(title,rows,fmt)=>{box.append(el('h2',null,title));if(!rows.length)return box.append(el('small',null,'No data yet.'));const mx=Math.max(...rows.map(r=>r[1]));rows.forEach(r=>{const b=el('div','bar'),f=el('span','f');f.style.width=Math.max(3,Math.round(r[1]/mx*100))+'%';const t=el('div');t.append(f);b.append(el('span',null,fmt?fmt(r[0]):r[0]),t,el('span',null,String(r[1])));box.append(b)})};
 const load=async()=>{box.textContent='Loading…';const{data,error}=await sb.rpc('analytics_summary',{p_days:Number(sel.value)});if(error){box.textContent='';return toast(error.message)}
  box.textContent='';const k=el('div','k');[['Visitors (all time)',data.total_visitors],['Active in period',data.active_visitors],['New in period',data.new_visitors],['Returning in period',data.returning_visitors],['Visits in period',data.visits]].forEach(([l,v])=>{const c=el('div','c');c.append(el('b',null,String(v)),el('small',null,l));k.append(c)});box.append(k);
  box.append(el('small',null,'Counts only visitors who chose Accept all. Each visitor is a random ID with no name, email, IP address or device details.'));
  bars('How often visitors come back (visits per visitor, all time)',['1','2-3','4-9','10+'].map(b=>[b+' visit'+(b==='1'?'':'s'),(data.frequency||{})[b]||0]));
  bars('Visits per day',(data.by_day||[]).map(d=>[d.day,d.visits]));
  const by=e=>(data.top||[]).filter(t=>t.event===e).map(t=>[t.label||'(none)',t.n]);
  bars('Pages viewed',by('page'));bars('Projects viewed',by('project'));bars('Invoices generated, by package',by('invoice'));bars('Pay button pressed, by package',by('pay_click'));
  bars('Where visitors came from',(data.referrers||[]).map(r=>[r.label||'direct',r.n]))};
 sel.onchange=load;load()}
function route(){const h=location.hash||'#/';h==='#/s/analytics'?analytics():h.startsWith('#/s/')?section(h.slice(4)):dash()}
addEventListener('hashchange',()=>{if(app.firstChild&&!$('.login'))route()});
init();
</script></body></html>
